<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">How Service Status checks your services</title>
<desc id="desc">The services.json file feeds three check types, statuspage, http and json, which run at the same time. The results go to one menu bar icon. Everything stays on your Mac except the requests to the URLs you write in the file.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/>
  </marker>
  <style>
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 28px; fill: #2d3142; }
    .sans  { font-family: Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
    .desc  { font-family: Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; fill: #4f5d75; }
    .mono  { font-family: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 9px; fill: #4f5d75; }
    .muted { font-family: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 9px; letter-spacing: 0.06em; fill: #7a8399; }
    .chip  { font-family: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 8px; letter-spacing: 0.06em; fill: #4f5d75; }
  </style>
</defs>

<rect width="1200" height="460" fill="#f5f5f5"/>

<text x="40" y="44" class="serif">How Service Status checks your services</text>
<text x="40" y="64" class="muted">SERVICES.JSON &#8594; THREE CHECKS AT ONCE &#8594; ONE ICON</text>

<!-- Boundary: everything inside stays on the Mac -->
<rect x="24" y="88" width="800" height="250" rx="8" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4 4"/>
<text x="40" y="108" class="muted">STAYS ON YOUR MAC</text>

<!-- Input -->
<rect x="64" y="181" width="170" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="149" y="209" text-anchor="middle" class="sans">services.json</text>
<text x="149" y="227" text-anchor="middle" class="mono">you edit this file</text>
<rect x="172" y="174" width="54" height="14" rx="3" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
<text x="199" y="184" text-anchor="middle" class="chip">INPUT</text>

<!-- Fan-out to three checks -->
<line x1="234" y1="213" x2="290" y2="213" stroke="#2d3142" stroke-width="1"/>
<line x1="290" y1="148" x2="290" y2="278" stroke="#2d3142" stroke-width="1"/>
<line x1="290" y1="148" x2="306" y2="148" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="290" y1="213" x2="306" y2="213" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="290" y1="278" x2="306" y2="278" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<text x="308" y="116" class="muted">AT THE SAME TIME</text>

<!-- Three check types -->
<rect x="308" y="126" width="210" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="413" y="145" text-anchor="middle" class="sans">statuspage</text>
<text x="413" y="160" text-anchor="middle" class="mono">Atlassian status pages</text>
<rect x="456" y="119" width="54" height="14" rx="3" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
<text x="483" y="129" text-anchor="middle" class="chip">CHECK</text>

<rect x="308" y="191" width="210" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="413" y="210" text-anchor="middle" class="sans">http</text>
<text x="413" y="225" text-anchor="middle" class="mono">websites and health endpoints</text>
<rect x="456" y="184" width="54" height="14" rx="3" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
<text x="483" y="194" text-anchor="middle" class="chip">CHECK</text>

<rect x="308" y="256" width="210" height="44" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="413" y="275" text-anchor="middle" class="sans">json</text>
<text x="413" y="290" text-anchor="middle" class="mono">app health values</text>
<rect x="456" y="249" width="54" height="14" rx="3" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
<text x="483" y="259" text-anchor="middle" class="chip">CHECK</text>

<!-- Results to the icon -->
<line x1="518" y1="148" x2="534" y2="148" stroke="#2d3142" stroke-width="1"/>
<line x1="518" y1="213" x2="534" y2="213" stroke="#2d3142" stroke-width="1"/>
<line x1="518" y1="278" x2="534" y2="278" stroke="#2d3142" stroke-width="1"/>
<line x1="534" y1="148" x2="534" y2="278" stroke="#2d3142" stroke-width="1"/>
<line x1="534" y1="213" x2="610" y2="213" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<text x="572" y="205" text-anchor="middle" class="muted">RESULTS</text>

<!-- Output: focal -->
<rect x="612" y="181" width="190" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="707" y="209" text-anchor="middle" class="sans">Menu bar icon</text>
<text x="707" y="227" text-anchor="middle" class="mono">worst state wins</text>
<rect x="740" y="174" width="54" height="14" rx="3" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1"/>
<text x="767" y="184" text-anchor="middle" class="chip">OUTPUT</text>

<!-- Only exit: requests to your own URLs -->
<line x1="413" y1="300" x2="413" y2="370" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>
<text x="424" y="358" class="muted">REQUESTS GO ONLY TO URLS YOU WROTE</text>
<rect x="308" y="372" width="210" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="413" y="396" text-anchor="middle" class="sans">Your services</text>
<text x="413" y="412" text-anchor="middle" class="mono">the URLs in services.json</text>
<rect x="456" y="365" width="54" height="14" rx="3" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
<text x="483" y="375" text-anchor="middle" class="chip">EXTERNAL</text>

<!-- Legend -->
<text x="870" y="108" class="muted">LEGEND</text>
<rect x="870" y="130" width="54" height="14" rx="3" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
<text x="897" y="140" text-anchor="middle" class="chip">INPUT</text>
<text x="936" y="141" class="desc">a file you edit</text>
<rect x="870" y="158" width="54" height="14" rx="3" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
<text x="897" y="168" text-anchor="middle" class="chip">CHECK</text>
<text x="936" y="169" class="desc">one request for each service</text>
<rect x="870" y="186" width="54" height="14" rx="3" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1"/>
<text x="897" y="196" text-anchor="middle" class="chip">OUTPUT</text>
<text x="936" y="197" class="desc">what you see</text>
<rect x="870" y="214" width="54" height="14" rx="3" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
<text x="897" y="224" text-anchor="middle" class="chip">EXTERNAL</text>
<text x="936" y="225" class="desc">outside your Mac</text>
<line x1="870" y1="249" x2="924" y2="249" stroke="#7a8399" stroke-width="1" stroke-dasharray="4 4"/>
<text x="936" y="253" class="desc">edge of your Mac</text>
</svg>
