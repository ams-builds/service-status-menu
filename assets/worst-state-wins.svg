<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Worst state wins</title>
<desc id="desc">Four app states in order of priority: Outage, Degraded, Unknown, Operational. The menu bar icon shows the first state that any service has. If the network is down, every service shows Unknown, not Outage.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/>
  </marker>
  <style>
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 28px; fill: #2d3142; }
    .sans  { font-family: Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
    .mono  { font-family: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 9px; fill: #4f5d75; }
    .note  { font-family: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 10px; fill: #4f5d75; }
    .muted { font-family: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 9px; letter-spacing: 0.06em; fill: #7a8399; }
    .chip  { font-family: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 8px; letter-spacing: 0.06em; fill: #4f5d75; }
  </style>
</defs>

<rect width="1200" height="340" fill="#f5f5f5"/>

<text x="40" y="44" class="serif">Worst state wins</text>
<text x="40" y="64" class="muted">THE ICON SHOWS THE FIRST STATE ON THIS LIST THAT ANY SERVICE HAS</text>

<text x="40" y="100" class="muted">HIGHEST PRIORITY</text>
<text x="1160" y="100" text-anchor="end" class="muted">LOWEST PRIORITY</text>

<!-- 1 Outage -->
<rect x="40" y="110" width="250" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="165" y="142" text-anchor="middle" class="sans">Outage</text>
<text x="165" y="162" text-anchor="middle" class="mono">statuspage: major, critical</text>
<rect x="256" y="103" width="26" height="14" rx="3" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
<text x="269" y="113" text-anchor="middle" class="chip">1</text>
<line x1="290" y1="146" x2="328" y2="146" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>

<!-- 2 Degraded -->
<rect x="330" y="110" width="250" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="455" y="142" text-anchor="middle" class="sans">Degraded</text>
<text x="455" y="162" text-anchor="middle" class="mono">statuspage: minor</text>
<rect x="546" y="103" width="26" height="14" rx="3" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
<text x="559" y="113" text-anchor="middle" class="chip">2</text>
<line x1="580" y1="146" x2="618" y2="146" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>

<!-- 3 Unknown: focal -->
<rect x="620" y="110" width="250" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="745" y="142" text-anchor="middle" class="sans">Unknown</text>
<text x="745" y="162" text-anchor="middle" class="mono">statuspage: unknown value, or error</text>
<rect x="836" y="103" width="26" height="14" rx="3" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1"/>
<text x="849" y="113" text-anchor="middle" class="chip">3</text>
<line x1="870" y1="146" x2="908" y2="146" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>

<!-- 4 Operational -->
<rect x="910" y="110" width="250" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="1035" y="142" text-anchor="middle" class="sans">Operational</text>
<text x="1035" y="162" text-anchor="middle" class="mono">statuspage: none</text>
<rect x="1126" y="103" width="26" height="14" rx="3" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
<text x="1139" y="113" text-anchor="middle" class="chip">4</text>

<!-- Link to the callout -->
<line x1="745" y1="182" x2="745" y2="234" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4 4"/>

<!-- Callout -->
<rect x="40" y="236" width="1120" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="64" y="268" class="sans">No network? Every service shows Unknown, not Outage.</text>
<text x="64" y="290" class="note">A disconnected Mac is not proof that your services are down.</text>
<rect x="1078" y="229" width="74" height="14" rx="3" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1"/>
<text x="1115" y="239" text-anchor="middle" class="chip">BY DESIGN</text>
</svg>
