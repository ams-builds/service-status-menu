<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Worst state wins</title>
<desc id="desc">Four app states in order of priority: Outage, Degraded, Unknown, Operational. The menu bar icon shows the first state that any service has. If the network is down, every service shows Unknown, not Outage.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="#2d3142"/>
  </marker>
</defs>

<rect x="0" y="0" width="1200" height="340" fill="#f5f5f5"/>
<text x="40" y="44" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" fill="#2d3142">Worst state wins</text>
<text x="40" y="64" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">THE ICON SHOWS THE FIRST STATE ON THIS LIST THAT ANY SERVICE HAS</text>
<text x="40" y="100" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">HIGHEST PRIORITY</text>
<text x="1160" y="100" text-anchor="end" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" letter-spacing="0.06em" fill="#7a8399">LOWEST PRIORITY</text>

<!-- 1 Outage -->
<rect x="40" y="110" width="250" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="256" y="116" width="26" height="16" rx="3" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
<text x="269" y="127" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75">1</text>
<text x="165" y="140.2" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Outage</text>
<text x="165" y="160.2" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" fill="#4f5d75">statuspage: major, critical</text>
<line x1="290" y1="146" x2="328" y2="146" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>

<!-- 2 Degraded -->
<rect x="330" y="110" width="250" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="546" y="116" width="26" height="16" rx="3" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
<text x="559" y="127" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75">2</text>
<text x="455" y="140.2" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Degraded</text>
<text x="455" y="160.2" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" fill="#4f5d75">statuspage: minor</text>
<line x1="580" y1="146" x2="618" y2="146" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>

<!-- 3 Unknown: focal -->
<rect x="620" y="110" width="250" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="836" y="116" width="26" height="16" rx="3" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1"/>
<text x="849" y="127" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75">3</text>
<text x="745" y="140.2" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Unknown</text>
<text x="745" y="160.2" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" fill="#4f5d75">statuspage: unknown value, or error</text>
<line x1="870" y1="146" x2="908" y2="146" stroke="#2d3142" stroke-width="1" marker-end="url(#arrow)"/>

<!-- 4 Operational -->
<rect x="910" y="110" width="250" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="1126" y="116" width="26" height="16" rx="3" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
<text x="1139" y="127" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75">4</text>
<text x="1035" y="140.2" text-anchor="middle" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Operational</text>
<text x="1035" y="160.2" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="9" fill="#4f5d75">statuspage: none</text>

<!-- Link to the callout -->
<line x1="745" y1="182" x2="745" y2="236" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4 4"/>

<!-- Callout -->
<rect x="40" y="236" width="1120" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="1078" y="244" width="74" height="16" rx="3" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1"/>
<text x="1115" y="255" text-anchor="middle" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75">BY DESIGN</text>
<text x="64" y="267.2" font-family="Geist, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#2d3142">No network? Every service shows Unknown, not Outage.</text>
<text x="64" y="289.2" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="10" fill="#4f5d75">A disconnected Mac is not proof that your services are down.</text>
</svg>
